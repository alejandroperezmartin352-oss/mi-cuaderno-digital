<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<title>Cuaderno Digital Pro · AleDev Studios</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cuaderno Digital Profesional v6.0 - Tiempo dinámico automático">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-paper: #fdfbf7;
  --grid-line: #e2e8f0;
  --margin-line: #fecaca;
  --s1: rgba(255, 255, 255, 0.95);
  --s2: rgba(241, 245, 249, 0.9);
  --s3: rgba(226, 232, 240, 0.6);
  --bd: #cbd5e1;
  --tx: #0f172a;
  --tx-soft: #334155;
  --mut: #64748b;
  --a: #2563eb;
  --b: #dc2626;
  --ok: #16a34a;
  --warn: #d97706;
  --c: var(--a);
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.1);
  --r: 8px;
  --r-md: 12px;
  --t: 250ms cubic-bezier(0.4, 0, 0.2, 1);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg-paper: #0f172a;
  --grid-line: #1e293b;
  --margin-line: #451a1a;
  --s1: rgba(30, 41, 59, 0.95);
  --s2: rgba(51, 65, 85, 0.9);
  --s3: rgba(71, 85, 105, 0.6);
  --bd: #334155;
  --tx: #f1f5f9;
  --tx-soft: #cbd5e1;
  --mut: #94a3b8;
  --a: #60a5fa;
  --b: #f87171;
  --ok: #4ade80;
  --warn: #fbbf24;
  --shadow: 0 4px 6px -1px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.6);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background-color: var(--bg-paper);
  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--tx);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  left: 48px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--margin-line);
  z-index: 0;
  pointer-events: none;
}
@media (max-width: 768px) { body::before { left: 24px; } }
h1, h2, h3 { font-family: 'Caveat', cursive; line-height: 1.1; color: var(--tx); }
h1 { font-size: clamp(2.5rem, 5vw, 3.75rem); font-weight: 700; margin-bottom: 16px; }
h2 { font-size: clamp(1.75rem, 3.5vw, 2.5rem); font-weight: 600; color: var(--a); margin-bottom: 12px; }
h3 { font-size: 1.5rem; font-weight: 600; margin-bottom: 8px; }
.mono { font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
.handwritten { font-family: 'Caveat', cursive; font-size: 1.4em; color: var(--b); font-weight: 700; }
.handwritten.ok { color: var(--ok); }
.eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--a); margin-bottom: 8px; display: block; }
.lead { font-size: 1.1rem; color: var(--mut); max-width: 65ch; line-height: 1.7; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; transition: all var(--t); }
button:disabled { cursor: not-allowed; opacity: 0.5; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--r);
  font-weight: 600;
  font-size: 0.95rem;
  background: var(--a);
  color: white;
  box-shadow: var(--shadow);
  transition: all var(--t);
}
.btn:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.s { background: var(--s2); color: var(--tx); border: 1px solid var(--bd); }
.btn.big { padding: 14px 28px; font-size: 1.1rem; }
.btn.success { background: var(--ok); }
.btn.warn { background: var(--warn); }
.btn.danger { background: var(--b); }
.input-pro {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--r);
  border: 2px solid var(--bd);
  background: var(--s1);
  color: var(--tx);
  font-size: 1rem;
  transition: all var(--t);
}
.input-pro:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px color-mix(in srgb, var(--a) 15%, transparent); }
.input-pro.mono { font-family: 'JetBrains Mono', monospace; }
.input-pro.error { border-color: var(--b); background: color-mix(in srgb, var(--b) 5%, var(--s1)); }
.input-pro.success { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 5%, var(--s1)); }
.top {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  background: color-mix(in srgb, var(--bg-paper) 88%, transparent);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--bd);
}
.brand { display: flex; align-items: center; gap: 10px; font-family: 'Caveat', cursive; font-size: 1.6rem; font-weight: 700; }
.brand .logo-icon { font-size: 1.8rem; }
#cr { flex: 1; font-size: 0.85rem; color: var(--mut); font-family: 'JetBrains Mono', monospace; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
#cr button { color: var(--a); text-decoration: underline dotted; }
.ibtn { width: 40px; height: 40px; border-radius: var(--r); border: 1px solid var(--bd); background: var(--s1); font-size: 1.2rem; display: grid; place-items: center; }
.ibtn:hover { background: var(--s2); }
#app { max-width: 960px; margin: 0 auto; padding: 32px 24px 140px; position: relative; z-index: 1; }
.grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.card {
  background: var(--s1);
  border: 1px solid var(--bd);
  border-left: 4px solid var(--c);
  border-radius: 4px;
  padding: 24px;
  box-shadow: var(--shadow);
  transition: all var(--t);
  text-align: left;
}
.card:hover:not(:disabled) { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.card .tag { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 700; padding: 3px 10px; border-radius: 4px; background: var(--s2); border: 1px solid var(--bd); color: var(--mut); }
.card h3 { margin-top: 10px; margin-bottom: 8px; font-size: 1.6rem; }
.card p { color: var(--mut); font-size: 0.9rem; margin-bottom: 12px; }
.panel { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r-md); padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.panel.accent { border-left: 4px solid var(--a); }
.panel.warn { border-left: 4px solid var(--warn); background: color-mix(in srgb, var(--warn) 5%, var(--s1)); }
.panel.info { border-left: 4px solid var(--a); background: color-mix(in srgb, var(--a) 5%, var(--s1)); }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--bd); margin-bottom: 24px; overflow-x: auto; }
.tab-btn { padding: 12px 20px; font-weight: 600; color: var(--mut); border-bottom: 3px solid transparent; margin-bottom: -2px; font-family: 'Caveat', cursive; font-size: 1.35rem; white-space: nowrap; }
.tab-btn:hover:not(.locked) { color: var(--a); }
.tab-btn.on { color: var(--a); border-bottom-color: var(--a); }
.tab-btn.locked { opacity: 0.45; cursor: not-allowed; }
.tab-btn.locked::after { content: ' 🔒'; }
.q-card {
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: var(--r-md);
  padding: 20px;
  margin-bottom: 16px;
  transition: all var(--t);
}
.q-card.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, var(--s2)); }
.q-card.ko { border-color: var(--b); background: color-mix(in srgb, var(--b) 8%, var(--s2)); }
.q-header { display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start; }
.q-num { width: 36px; height: 36px; border-radius: 50%; background: var(--a); color: white; display: grid; place-items: center; font-family: 'JetBrains Mono', monospace; font-weight: 700; flex-shrink: 0; }
.q-card.ok .q-num { background: var(--ok); }
.q-card.ko .q-num { background: var(--b); }
.q-text { font-weight: 600; font-size: 1.05rem; flex: 1; }
.q-type { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--s3); color: var(--mut); margin-left: 8px; vertical-align: middle; }
.q-pts { font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--mut); margin-left: auto; white-space: nowrap; }
.q-ops { margin: 12px 0; }
.q-ops label { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 6px 0; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; transition: all var(--t); background: var(--s1); }
.q-ops label:hover { background: var(--s3); border-color: var(--bd); }
.q-ops input { accent-color: var(--a); transform: scale(1.2); }
.q-card.done .q-ops label.right { background: color-mix(in srgb, var(--ok) 15%, transparent); border-color: var(--ok); font-weight: 600; }
.q-card.done .q-ops label.right::after { content: ' ✓'; color: var(--ok); font-weight: 700; margin-left: auto; }
.q-card.done .q-ops label.wrong { background: color-mix(in srgb, var(--b) 12%, transparent); border-color: var(--b); text-decoration: line-through; opacity: 0.75; }
.q-card.done .q-ops label.wrong::after { content: ' ✗'; color: var(--b); font-weight: 700; margin-left: auto; }
.feedback-box { margin-top: 14px; padding: 14px 16px; border-radius: var(--r); background: var(--s1); border-left: 4px solid var(--a); font-size: 0.95rem; color: var(--tx-soft); display: none; }
.q-card.done .feedback-box { display: block; }
.q-card.ok .feedback-box { border-left-color: var(--ok); }
.q-card.ko .feedback-box { border-left-color: var(--b); }
.typewriter-text { font-family: 'Caveat', cursive; font-size: 1.3em; color: var(--b); font-weight: 700; border-right: 2px solid var(--b); padding-right: 2px; animation: blink 0.8s infinite; }
@keyframes blink { 50% { border-color: transparent; } }

/* UNIR / MATCH */
.match-container { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 12px 0; }
.match-item { padding: 10px 14px; background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); font-size: 0.9rem; }
.match-select { padding: 8px 12px; border-radius: var(--r); border: 2px solid var(--bd); background: var(--s1); color: var(--tx); font-size: 0.9rem; }
.match-item.correct { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--s1)); }
.match-item.wrong { border-color: var(--b); background: color-mix(in srgb, var(--b) 10%, var(--s1)); }

/* COMPLETAR TEXTO LARGO */
.long-text { background: var(--s1); border: 1px solid var(--bd); border-radius: var(--r); padding: 16px; margin: 12px 0; line-height: 1.9; font-size: 0.95rem; }
.long-text .blank { display: inline-block; min-width: 110px; border-bottom: 2px dashed var(--a); padding: 2px 8px; margin: 0 4px; font-weight: 600; color: var(--a); }
.long-text .blank.filled { background: color-mix(in srgb, var(--a) 10%, transparent); border-bottom-style: solid; }
.long-text .blank.correct { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.long-text .blank.wrong { border-color: var(--b); color: var(--b); background: color-mix(in srgb, var(--b) 10%, transparent); }

/* TIMER SIEMPRE VISIBLE */
#timer-bar {
  position: sticky;
  top: 65px;
  z-index: 40;
  background: var(--s1);
  border: 2px solid var(--ok);
  border-radius: var(--r-md);
  padding: 12px 20px;
  margin-bottom: 20px;
  display: none;
  box-shadow: var(--shadow-lg);
  backdrop-filter: blur(10px);
}
#timer-bar.visible { display: block; }
#timer-bar.warn { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--s1)); }
#timer-bar.bad { border-color: var(--b); background: color-mix(in srgb, var(--b) 10%, var(--s1)); animation: pulse 0.5s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.01); } }
.timer-content { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
.timer-left { display: flex; align-items: center; gap: 12px; }
.timer-icon { font-size: 1.5rem; }
.timer-time { font-family: 'JetBrains Mono', monospace; font-size: 2rem; font-weight: 700; color: var(--ok); letter-spacing: 0.05em; }
#timer-bar.warn .timer-time { color: var(--warn); }
#timer-bar.bad .timer-time { color: var(--b); }
.timer-info { font-size: 0.85rem; color: var(--mut); font-family: 'JetBrains Mono', monospace; }
.timer-progress { width: 100%; height: 6px; background: var(--s2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.timer-progress-bar { height: 100%; background: var(--ok); transition: width 1s linear, background 0.3s; }
#timer-bar.warn .timer-progress-bar { background: var(--warn); }
#timer-bar.bad .timer-progress-bar { background: var(--b); }

/* SCRATCHPAD */
#scratchpad-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity var(--t); }
#scratchpad-overlay.open { opacity: 1; pointer-events: auto; }
#scratchpad { position: fixed; bottom: 0; left: 0; right: 0; z-index: 100; background: var(--bg-paper); background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px); background-size: 24px 24px; border-top: 3px solid var(--a); border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.2); transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; max-height: 70vh; }
#scratchpad.open { transform: translateY(0); }
.sp-handle { width: 48px; height: 5px; background: var(--bd); border-radius: 3px; margin: 12px auto 8px; cursor: grab; }
.sp-header { padding: 0 24px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--bd); }
.sp-header h3 { margin: 0; font-size: 1.5rem; color: var(--a); }
#scratchpad textarea { flex: 1; width: 100%; border: none; background: transparent; color: var(--tx); padding: 20px 24px 20px 60px; font-family: 'Caveat', cursive; font-size: 1.5rem; line-height: 24px; resize: none; outline: none; background-image: linear-gradient(transparent 23px, var(--grid-line) 24px); background-size: 100% 24px; background-attachment: local; }
#fab-scratch { position: fixed; bottom: 24px; right: 24px; z-index: 80; width: 60px; height: 60px; border-radius: 50%; background: var(--warn); color: white; box-shadow: var(--shadow-lg); font-size: 1.6rem; display: grid; place-items: center; transition: all var(--t); border: 3px solid var(--bg-paper); }
#fab-scratch:hover { transform: scale(1.1) rotate(10deg); }

/* CORRECCIÓN ANIMADA */
#correction-hand { position: fixed; z-index: 200; pointer-events: none; opacity: 0; width: 200px; height: 200px; transition: all 0.7s cubic-bezier(0.34, 1.56, 0.64, 1); filter: drop-shadow(0 12px 20px rgba(0,0,0,0.25)); }
#correction-hand.active { opacity: 1; }
#correction-hand svg { width: 100%; height: 100%; }
#correction-hand.writing svg { animation: wiggle 0.3s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.draw-path { fill: none; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 200; stroke-dashoffset: 200; }
.draw-path.animate { animation: drawPath 0.7s ease-out forwards; }
@keyframes drawPath { to { stroke-dashoffset: 0; } }

/* RESULTADO */
.result-card { background: var(--s1); border: 2px solid var(--c); border-radius: 16px; padding: 32px; text-align: center; box-shadow: var(--shadow-lg); margin-top: 32px; }
.result-grade { font-family: 'Caveat', cursive; font-size: 6rem; font-weight: 700; color: var(--c); margin: 16px 0; }
.result-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin: 24px 0; }
.result-detail { padding: 16px; background: var(--s2); border-radius: var(--r); border: 1px solid var(--bd); }
.result-detail .val { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 700; color: var(--a); display: block; }
.result-detail .lbl { font-size: 0.8rem; color: var(--mut); text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }

.cfg { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 0.75rem; font-weight: 700; color: var(--mut); text-transform: uppercase; letter-spacing: 0.08em; font-family: 'JetBrains Mono', monospace; }

.pro-tip { background: color-mix(in srgb, var(--warn) 8%, var(--s1)); border-left: 4px solid var(--warn); padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; margin: 20px 0; font-size: 0.95rem; color: var(--tx-soft); line-height: 1.6; }
.pro-tip strong { color: var(--warn); }
.pro-tip.info { background: color-mix(in srgb, var(--a) 8%, var(--s1)); border-left-color: var(--a); }
.pro-tip.info strong { color: var(--a); }
.pro-tip.warn { background: color-mix(in srgb, var(--warn) 8%, var(--s1)); border-left-color: var(--warn); }
.pro-tip ul { margin: 8px 0 0 20px; }
.pro-tip li { margin-bottom: 4px; }

.defs { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); margin: 16px 0; }
.def { padding: 14px 16px; border-radius: var(--r); background: var(--s2); border: 1px solid var(--bd); border-left: 3px solid var(--a); }
.def b { color: var(--a); font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 700; }
.def span { color: var(--tx-soft); font-size: 0.95rem; line-height: 1.5; }

.hidden { display: none !important; }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-sm { gap: 8px; }
.gap { gap: 16px; }
.mt-sm { margin-top: 8px; }
.mt { margin-top: 16px; }
.mt-lg { margin-top: 32px; }
.mb { margin-bottom: 16px; }
.mb-lg { margin-bottom: 32px; }
.text-center { text-align: center; }
.text-muted { color: var(--mut); }
.text-sm { font-size: 0.85rem; }
.text-xs { font-size: 0.75rem; }
.w-full { width: 100%; }

@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.animate-fadeInUp { animation: fadeInUp 0.5s ease-out; }

@media (max-width: 768px) {
  body { font-size: 14px; }
  .top { padding: 10px 16px; gap: 8px; }
  .brand { font-size: 1.3rem; }
  #app { padding: 20px 16px 120px; }
  .panel { padding: 18px; }
  .q-card { padding: 16px; }
  .timer-time { font-size: 1.5rem; }
  #timer-bar { top: 60px; padding: 10px 14px; }
  #fab-scratch { width: 52px; height: 52px; font-size: 1.4rem; bottom: 16px; right: 16px; }
  .defs { grid-template-columns: 1fr; }
  .match-container { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<header class="top">
  <button class="brand" onclick="app.go('home')">
    <span class="logo-icon">📓</span>
    <span>Cuaderno Digital</span>
  </button>
  <nav id="cr" aria-label="Ruta"></nav>
  <button class="ibtn" onclick="app.toggleTheme()" title="Cambiar tema">◐</button>
</header>

<main id="app"></main>

<!-- TIMER BAR SIEMPRE VISIBLE -->
<div id="timer-bar">
  <div class="timer-content">
    <div class="timer-left">
      <span class="timer-icon">⏱️</span>
      <div>
        <div class="timer-time" id="timer-display">00:00</div>
        <div class="timer-info" id="timer-info">Tiempo restante</div>
      </div>
    </div>
    <div style="text-align:right;">
      <div class="timer-info" id="timer-progress-text">0 / 0 respondidas</div>
      <div class="timer-info" id="timer-formula" style="color:var(--a);"></div>
    </div>
  </div>
  <div class="timer-progress">
    <div class="timer-progress-bar" id="timer-progress-bar" style="width:100%;"></div>
  </div>
</div>

<!-- SCRATCHPAD -->
<div id="scratchpad-overlay" onclick="app.toggleScratchpad()"></div>
<aside id="scratchpad">
  <div class="sp-handle" onclick="app.toggleScratchpad()"></div>
  <div class="sp-header">
    <h3>📝 Hoja de Sucio</h3>
    <button class="btn s" onclick="app.clearScratchpad()">🗑️ Borrar</button>
  </div>

<script>
'use strict';

const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => [...p.querySelectorAll(s)];

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9+#\/. ]/g, '').replace(/\s+/g, ' ').trim();
const wait = ms => new Promise(r => setTimeout(r, ms));
const ls = {
  g: k => { try { return localStorage.getItem(k); } catch { return null; } },
  s: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

function mulberry32(a) {
  return function() {
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function shuffle(arr, seed) {
  const rand = mulberry32(seed);
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(secs) {
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function randomSeed() {
  return Math.floor(Math.random() * 999999) + 100000;
}

function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:${type==='error'?'var(--b)':type==='warn'?'var(--warn)':'var(--a)'};color:white;padding:12px 24px;border-radius:8px;z-index:500;font-weight:600;box-shadow:0 10px 25px rgba(0,0,0,0.2);`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

/* ================================================================
   FÓRMULA DE TIEMPO DINÁMICO
   ================================================================
   Tiempo = BASE + Σ(tiempo por pregunta según tipo)
   
   BASE = 2 minutos (preparación)
   
   Por tipo de pregunta:
   - test (mc): 30 segundos
   - verdadero/falso (vf): 25 segundos
   - rellenar huecos corto (fh): 40 segundos
   - unir (ma): 50 segundos
   - completar texto largo (lt): 75 segundos (texto de 5 líneas)
   
   Ejemplos:
   - 10 preguntas test = 2 + 10*0.5 = 7 min
   - 20 preguntas mixtas = 2 + 20*0.6 = 14 min
   - 50 preguntas = 2 + 50*0.6 = 32 min
   ================================================================ */
const TIME_PER_TYPE = {
  mc: 30,   // Test
  vf: 25,   // Verdadero/Falso
  fh: 40,   // Rellenar huecos corto
  ma: 50,   // Unir conceptos
  lt: 75    // Completar texto largo (5 líneas)
};
const TIME_BASE = 120; // 2 minutos base

function calculateExamTime(questions) {
  let totalSecs = TIME_BASE;
  questions.forEach(q => {
    totalSecs += TIME_PER_TYPE[q.type] || 40;
  });
  // Añadir 10% de margen
  totalSecs = Math.ceil(totalSecs * 1.1);
  // Redondear a minutos completos
  return Math.ceil(totalSecs / 60) * 60;
}

/* ================================================================
   GENERADOR DE PREGUNTAS DINÁMICO
   ================================================================ */
function generateQuestions(topic, count, seed) {
  const rand = mulberry32(seed);
  const questions = [];
  
  // Distribución de tipos según count
  const distribution = {
    mc: Math.floor(count * 0.30),  // 30% test
    vf: Math.floor(count * 0.20),  // 20% V/F
    fh: Math.floor(count * 0.20),  // 20% huecos
    ma: Math.floor(count * 0.15),  // 15% unir
    lt: Math.floor(count * 0.15)   // 15% completar texto largo
  };
  
  // Ajustar para que sumen count
  const total = Object.values(distribution).reduce((a,b) => a+b, 0);
  if (total < count) distribution.mc += (count - total);
  
  // Generar test (mc)
  const mcPool = shuffle(topic.questions.filter(q => q.type === 'mc'), seed);
  for (let i = 0; i < distribution.mc && i < mcPool.length; i++) {
    questions.push({...mcPool[i], id: questions.length});
  }
  
  // Generar V/F
  const vfPool = shuffle(topic.questions.filter(q => q.type === 'vf'), seed + 1);
  for (let i = 0; i < distribution.vf && i < vfPool.length; i++) {
    questions.push({...vfPool[i], id: questions.length});
  }
  
  // Generar huecos (fh)
  const fhPool = shuffle(topic.questions.filter(q => q.type === 'fh'), seed + 2);
  for (let i = 0; i < distribution.fh && i < fhPool.length; i++) {
    questions.push({...fhPool[i], id: questions.length});
  }
  
  // Generar unir (ma) - desde conceptos
  const conceptSections = {};
  topic.concepts.forEach(c => {
    if (!conceptSections[c.s]) conceptSections[c.s] = [];
    conceptSections[c.s].push(c);
  });
  const sectionKeys = shuffle(Object.keys(conceptSections), seed + 3);
  let maCount = 0;
  for (const s of sectionKeys) {
    if (maCount >= distribution.ma) break;
    const concepts = conceptSections[s];
    if (concepts.length >= 4) {
      const selected = shuffle(concepts, seed + maCount).slice(0, 4);
      const lefts = selected.map(c => c.term.split(';')[0]);
      const rights = shuffle(selected.map(c => c.def.substring(0, 50) + (c.def.length > 50 ? '...' : '')), seed + maCount);
      questions.push({
        id: questions.length,
        type: 'ma',
        q: `Une cada concepto con su definición (${topic.sections[s] || 'General'}):`,
        lefts,
        rights,
        correctPairs: lefts.map(l => {
          const c = selected.find(x => x.term.split(';')[0] === l);
          return rights.indexOf(c.def.substring(0, 50) + (c.def.length > 50 ? '...' : ''));
        }),
        exp: selected.map(c => `${c.term.split(';')[0]}: ${c.def}`).join(' · '),
        pts: 3
      });
      maCount++;
    }
  }
  
  // Generar completar texto largo (lt)
  if (topic.longTexts && topic.longTexts.length > 0) {
    const ltPool = shuffle(topic.longTexts, seed + 4);
    for (let i = 0; i < distribution.lt && i < ltPool.length; i++) {
      const lt = ltPool[i];
      questions.push({
        id: questions.length,
        type: 'lt',
        text: lt.text,
        blanks: lt.blanks,
        exp: 'Palabras correctas: ' + lt.blanks.join(', '),
        pts: 5
      });
    }
  }
  
  // Rellenar con lo que falte
  while (questions.length < count) {
    const concept = topic.concepts[Math.floor(rand() * topic.concepts.length)];
    questions.push({
      id: questions.length,
      type: 'fh',
      q: `___: ${concept.def}`,
      a: concept.term.split(';'),
      exp: concept.def,
      pts: 1.5
    });
  }
  
  // Barajar todo
  const shuffled = shuffle(questions, seed + 10);
  shuffled.forEach((q, i) => q.id = i);
  
  return shuffled.slice(0, count);
}

/* ================================================================
   MOTOR DE CORRECCIÓN ANIMADA
   ================================================================ */
async function animateCorrection(qEl, isCorrect, correctText, explanation) {
  const hand = $('#correction-hand');
  const path = $('#mark-path');
  const rect = qEl.getBoundingClientRect();
  const scrollY = window.scrollY || window.pageYOffset;
  
  hand.classList.add('active');
  hand.classList.remove('writing');
  hand.style.transform = `translate(${rect.left + rect.width/2 - 100}px, ${rect.top + scrollY - 80}px)`;
  
  await wait(400);
  
  hand.classList.add('writing');
  if (isCorrect) {
    path.setAttribute('d', 'M140 100 L120 130 L160 170');
    path.style.stroke = 'var(--ok)';
  } else {
    path.setAttribute('d', 'M120 100 L160 140 M160 100 L120 140');
    path.style.stroke = 'var(--b)';
  }
  path.classList.add('animate');
  
  await wait(600);
  
  // Mostrar feedback
  const fbBox = $('.feedback-box', qEl);
  if (fbBox) {
    if (isCorrect) {
      fbBox.innerHTML = `<span class="handwritten ok">✓ ¡Correcto!</span><br><small style="color:var(--mut);margin-top:6px;display:block;">💡 ${explanation}</small>`;
    } else {
      const idx = qEl.dataset.idx;
      fbBox.innerHTML = `<div id="tw-${idx}"></div><small style="color:var(--mut);margin-top:6px;display:block;">💡 ${explanation}</small>`;
      const tw = $(`#tw-${idx}`);
      if (tw && correctText) {
        tw.innerHTML = `<span class="handwritten">Corrección: </span><span id="twt-${idx}" class="typewriter-text"></span>`;
        const twt = $(`#twt-${idx}`);
        for (let i = 0; i <= correctText.length; i++) {
          if (state.skipCorrection) break;
          twt.textContent = correctText.substring(0, i);
          await wait(25 + Math.random() * 30);
        }
      }
    }
    fbBox.style.display = 'block';
  }
  
  await wait(250);
  hand.classList.remove('writing', 'active');
  path.classList.remove('animate');
}

    cr.innerHTML = `<button onclick="app.go('home')">Inicio</button> › <button onclick="app.go('subject')">${subject.name}</button> › <span>${isExam ? 'Examen' : 'Práctica'}</span>`;
    
    const theoryTab = isExam 
      ? `<button class="tab-btn locked" title="Bloqueado durante el examen">📖 Teoría</button>`
      : `<button class="tab-btn" onclick="app.go('theory')">📖 Teoría</button>`;
    
    const qHtml = state.questions.map((q, i) => {
      let optsHtml = '';
      
      if (q.type === 'mc') {
        optsHtml = q.opts.map((opt, idx) => `
          <label><input type="radio" name="q${i}" value="${idx}"><span>${opt}</span></label>
        `).join('');
      } else if (q.type === 'vf') {
        optsHtml = `
          <label><input type="radio" name="q${i}" value="true"><span>Verdadero</span></label>
          <label><input type="radio" name="q${i}" value="false"><span>Falso</span></label>
        `;
      } else if (q.type === 'fh') {
        optsHtml = `<input type="text" class="input-pro" id="fh-${i}" placeholder="Escribe tu respuesta..." autocomplete="off" autocapitalize="none" spellcheck="false">`;
      } else if (q.type === 'ma') {
        optsHtml = `
          <div style="margin:12px 0;">
            ${q.lefts.map((l, idx) => `
              <div class="match-container">
                <div class="match-item">${l}</div>
                <span style="color:var(--mut);">→</span>
                <select class="match-select ma-sel-${i}" data-idx="${idx}">
                  <option value="">— Selecciona —</option>
                  ${q.rights.map((r, ridx) => `<option value="${ridx}">${r}</option>`).join('')}
                </select>
              </div>
            `).join('')}
          </div>
        `;
      } else if (q.type === 'lt') {
        // Texto largo con huecos
        let textWithInputs = q.text;
        q.blanks.forEach((blank, idx) => {
          const inputHtml = `<input type="text" class="lt-input-${i}" data-idx="${idx}" placeholder="..." autocomplete="off" autocapitalize="none" spellcheck="false" style="display:inline-block;min-width:120px;border-bottom:2px dashed var(--a);padding:2px 8px;margin:0 4px;background:transparent;border-top:0;border-left:0;border-right:0;color:var(--a);font-weight:600;">`;
          textWithInputs = textWithInputs.replace('___', `<span class="blank">${inputHtml}</span>`);
        });
        optsHtml = `<div class="long-text">${textWithInputs}</div>`;
      }
      
      const typeName = CONFIG.questionTypes[q.type]?.name || q.type;
      const pts = CONFIG.questionTypes[q.type]?.pts || 1;
      
      return `
        <div class="q-card" id="qcard-${i}" data-idx="${i}">
          <div class="q-header">
            <div class="q-num">${i + 1}</div>
            <div class="q-text">
              ${q.type === 'lt' ? 'Completa el siguiente texto:' : q.q}
              <span class="q-type">${typeName}</span>
            </div>
            <div class="q-pts">${pts} pt${pts !== 1 ? 's' : ''}</div>
          </div>
          <div class="q-ops">${optsHtml}</div>
          ${!isExam ? `<button class="btn s text-sm" onclick="app.showHint(${i})" style="margin-top:8px;">💡 Pista</button><div class="hint-box" id="hint-${i}" style="display:none;margin-top:8px;padding:10px;background:var(--s2);border-radius:var(--r);font-size:0.9rem;color:var(--mut);"></div>` : ''}
          <div class="feedback-box"></div>
        </div>
      `;
    }).join('');
    
    const totalPts = state.questions.reduce((a, q) => a + (CONFIG.questionTypes[q.type]?.pts || 1), 0);
    
    main.innerHTML = `
      <div class="animate-fadeInUp">
        <div class="tabs">
          ${theoryTab}
          <button class="tab-btn on">✍️ ${isExam ? 'Examen' : 'Práctica'}</button>
        </div>
        <div class="flex justify-between items-center mb" style="flex-wrap:wrap;gap:12px;">
          <div class="flex gap-sm items-center" style="flex-wrap:wrap;">
            <span class="mono text-sm" style="color:var(--mut);"><b>Alumno:</b> ${state.studentName || 'Anónimo'}</span>
            <span class="mono text-sm" style="color:var(--mut);"><b>Seed:</b> ${state.seed}</span>
            <span class="mono text-sm" style="color:var(--mut);"><b>Total:</b> ${totalPts} pts</span>
          </div>
        </div>
        ${!isExam ? `<div class="pro-tip info mb"><strong>💡 Modo práctica:</strong> Puedes usar las pistas y consultar la teoría.</div>` : ''}
        <div id="questions-container">${qHtml}</div>
        <div class="text-center mt-lg">
          <button class="btn big" id="btn-grade" onclick="app.gradeExam(false)">
            ${isExam ? '📤 Entregar Examen' : '✓ Corregir Práctica'}
          </button>
        </div>
      </div>
    `;
  },
  
  showHint(idx) {
    const q = state.questions[idx];
    if (!q) return;
    const hintBox = $(`#hint-${idx}`);
    if (!hintBox) return;
    
    if (!hintBox.style.display || hintBox.style.display === 'none') {
      let hint = '';
      if (q.type === 'fh' && q.a && q.a.length > 0) {
        hint = `Empieza por "${q.a[0][0]}" · ${q.a[0].length} letras`;
      } else if (q.type === 'lt') {
        hint = `El texto tiene ${q.blanks.length} huecos. Piensa en los conceptos clave del tema.`;
      } else if (q.type === 'ma') {
        hint = 'Relaciona cada concepto con su definición más precisa.';
      } else {
        hint = 'Piensa en la definición exacta del concepto.';
      }
      hintBox.textContent = '💡 ' + hint;
      hintBox.style.display = 'block';
    } else {
      hintBox.style.display = 'none';
    }
  },
  
  async gradeExam(timeOut) {
    if (state.correcting) return;
    state.correcting = true;
    
    const btn = $('#btn-grade');
    if (btn) { btn.disabled = true; btn.textContent = 'Corrigiendo...'; }
    
    let correctCount = 0;
    let totalPts = 0;
    let earnedPts = 0;
    
    for (let i = 0; i < state.questions.length; i++) {
      const q = state.questions[i];
      const card = $(`#qcard-${i}`);
      if (!card) continue;
      const result = this.checkAnswer(q, i);
      
      if (result.correct) correctCount++;
      totalPts += result.maxPts;
      earnedPts += result.earned;
      
      this.applyVisualCorrection(card, q, i, result);
      
      if (!state.skipCorrection) {
        await animateCorrection(card, result.correct, result.correctText, q.exp);
        await wait(200);
      }
    }
    
    const score = totalPts > 0 ? (earnedPts / totalPts) * 10 : 0;
    const grade = this.getGrade(score);
    
    this.showResult(score, grade, correctCount, state.questions.length, earnedPts, totalPts, timeOut);
    
    state.correcting = false;
  },
  
  checkAnswer(q, idx) {
    let correct = false;
    let correctText = '';
    let earned = 0;
    const maxPts = CONFIG.questionTypes[q.type]?.pts || 1;
    
    if (q.type === 'mc') {
      const selected = $(`input[name="q${idx}"]:checked`);
      if (selected) {
        const val = parseInt(selected.value);
        correct = val === q.a;
        correctText = q.opts[q.a];
        if (correct) earned = maxPts;
      }
    } else if (q.type === 'vf') {
      const selected = $(`input[name="q${idx}"]:checked`);
      if (selected) {
        const val = selected.value === 'true';
        correct = val === q.a;
        correctText = q.a ? 'Verdadero' : 'Falso';
        if (correct) earned = maxPts;
      }
    } else if (q.type === 'fh') {
      const input = $(`#fh-${idx}`);
      if (input) {
        const userAnswer = input.value.trim();
        const normalizedUser = norm(userAnswer);
        correct = q.a.some(ans => norm(ans) === normalizedUser);
        correctText = q.a[0].split(';')[0].toUpperCase();
        if (correct) earned = maxPts;
      }
    } else if (q.type === 'ma') {
      const sels = $$(`.ma-sel-${idx}`);
      let matches = 0;
      sels.forEach((sel, j) => {
        if (parseInt(sel.value) === q.correctPairs[j]) matches++;
      });
      const ratio = matches / q.lefts.length;
      correct = ratio === 1;
      earned = maxPts * ratio;
      correctText = `${matches}/${q.lefts.length} correctas`;
    } else if (q.type === 'lt') {
      const inputs = $$(`.lt-input-${idx}`);
      let matches = 0;
      inputs.forEach((inp, j) => {
        const userVal = norm(inp.value);
        if (q.blanks[j] && norm(q.blanks[j]) === userVal) matches++;
      });
      const ratio = matches / q.blanks.length;
      correct = ratio === 1;
      earned = maxPts * ratio;
      correctText = `${matches}/${q.blanks.length} palabras correctas`;
    }
    
    return {correct, correctText, earned, maxPts};
  },
  
  applyVisualCorrection(card, q, idx, result) {
    card.classList.add('done');
    
    if (q.type === 'mc' || q.type === 'vf') {
      $$(`input[name="q${idx}"]`).forEach(inp => {
        const val = q.type === 'vf' ? (inp.value === 'true') : parseInt(inp.value);
        const label = inp.parentElement;
        if (val === q.a) label.classList.add('right');
        else if (inp.checked) label.classList.add('wrong');
        inp.disabled = true;
      });
    } else if (q.type === 'fh') {
      const input = $(`#fh-${idx}`);
      if (input) {
        input.disabled = true;
        input.classList.add(result.correct ? 'success' : 'error');
      }
    } else if (q.type === 'ma') {
      const sels = $$(`.ma-sel-${idx}`);
      sels.forEach((sel, j) => {
        sel.disabled = true;
        const isOk = parseInt(sel.value) === q.correctPairs[j];
        sel.style.borderColor = isOk ? 'var(--ok)' : 'var(--b)';
        sel.style.background = isOk ? 'color-mix(in srgb, var(--ok) 10%, var(--s1))' : 'color-mix(in srgb, var(--b) 10%, var(--s1))';
      });
    } else if (q.type === 'lt') {
      const inputs = $$(`.lt-input-${idx}`);
      inputs.forEach((inp, j) => {
        inp.disabled = true;
        const isOk = q.blanks[j] && norm(q.blanks[j]) === norm(inp.value);
        const blank = inp.closest('.blank');
        if (blank) {
          blank.classList.remove('blank');
          blank.classList.add(isOk ? 'correct' : 'wrong');
          if (!isOk) {
            const correction = document.createElement('small');
            correction.style.cssText = 'color:var(--b);font-weight:700;display:block;';
            correction.textContent = '→ ' + q.blanks[j];
            blank.appendChild(correction);
          }
        }
      });
    }
    
    card.classList.add(result.correct ? 'ok' : 'ko');
  },
  
  getGrade(score) {
    if (score >= 9) return CONFIG.grades.A;
    if (score >= 7) return CONFIG.grades.B;
    if (score >= 5) return CONFIG.grades.C;
    return CONFIG.grades.F;
  },
  
  showResult(score, grade, correct, total, earned, maxPts, timeOut) {
    const container = $('#questions-container');
    if (!container) return;
    
    const resultHtml = `
      <div class="result-card" style="--c: ${grade.color}">
        <span class="eyebrow">${timeOut ? '⏱ Tiempo agotado' : 'Resultado del examen'}</span>
        <div class="result-grade">${score.toFixed(1)}</div>
        <h2 style="color:${grade.color}">${grade.label}</h2>
        <p class="text-muted">${grade.msg[Math.floor(Math.random() * grade.msg.length)]}</p>
        <div class="result-details">
          <div class="result-detail"><span class="val">${correct}/${total}</span><span class="lbl">Aciertos</span></div>
          <div class="result-detail"><span class="val">${earned.toFixed(1)}/${maxPts}</span><span class="lbl">Puntos</span></div>
          <div class="result-detail"><span class="val">${state.studentName}</span><span class="lbl">Alumno</span></div>
          <div class="result-detail"><span class="val">${state.seed}</span><span class="lbl">Seed</span></div>
          <div class="result-detail"><span class="val">${fmtTime(state.totalTime)}</span><span class="lbl">Tiempo asignado</span></div>
        </div>
        <div class="flex gap-sm" style="flex-wrap:wrap;justify-content:center;margin-top:24px;">
          <button class="btn s" onclick="app.go('subject')">← Volver a temas</button>
          <button class="btn" onclick="app.go('exam-setup')">🔄 Repetir</button>
          <button class="btn success" onclick="app.go('home')">🏠 Inicio</button>
        </div>
      </div>
    `;
    
    container.insertAdjacentHTML('afterend', resultHtml);
    const btn = $('#btn-grade');
    if (btn) btn.style.display = 'none';
    
    setTimeout(() => {
      const rc = $('.result-card');
      if (rc) rc.scrollIntoView({behavior: 'smooth', block: 'center'});
    }, 300);
  }
};

document.addEventListener('DOMContentLoaded', () => app.init());

window.addEventListener('beforeunload', (e) => {
  if (state.examActive && state.questions.length > 0 && state.timeLeft > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});
</script>
</body>
</html>
